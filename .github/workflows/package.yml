name: package

on:
  workflow_dispatch:
  workflow_call:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package -p trigora
      - run: cargo package -p trigora-client
      - name: Packaged crates have no path dependencies
        run: |
          for crate in target/package/trigora-*.crate target/package/trigora-client-*.crate; do
            files="$(tar -tzf "$crate")"
            toml="$(printf '%s\n' "$files" | grep -E '/Cargo.toml$')"
            toml="${toml%%$'\n'*}"
            if [ -z "$toml" ]; then
              echo "Cargo.toml missing from $crate" >&2
              exit 1
            fi
            manifest="$(tar -xOf "$crate" "$toml")"
            if printf '%s\n' "$manifest" | grep -E 'path[[:space:]]*=[[:space:]]*"\.\.'; then
              echo "path dependency remains in $crate" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v6
        with:
          name: trigora-rust-1.0.0
          path: target/package/*.crate
