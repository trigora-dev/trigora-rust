name: release

on:
  push:
    tags: ["v1.0.0"]

jobs:
  package:
    uses: ./.github/workflows/package.yml

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          set -euo pipefail
          publish() {
            local name="$1"
            local output status
            set +e
            output=$(cargo publish -p "$name" 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              return 0
            fi
            if printf '%s\n' "$output" | grep -Eiq 'already exists|already uploaded'; then
              return 0
            fi
            return "$status"
          }
          publish trigora-client
          publish trigora
      - uses: actions/download-artifact@v7
        with:
          name: trigora-rust-1.0.0
          path: dist
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
